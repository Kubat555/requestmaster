[package]
name = "rqm-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "RequestMaster: the \"Send\" scenario — builds an HTTP request from a stored request and sends it."

[dependencies]
rqm-model = { path = "../rqm-model" }
rqm-vars = { path = "../rqm-vars" }
rqm-store = { path = "../rqm-store" }
rqm-http = { path = "../rqm-http" }
rqm-script = { path = "../rqm-script" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
# Only for tests/variable_changes.rs: reads a row of the database byte for byte.
rusqlite = { workspace = true }
# Only for tests/owner_end_to_end.rs (import → store → export on the owner's samples); not a regular dependency.
rqm-postman = { path = "../rqm-postman" }
