[package]
name = "requestmaster"
version = "0.1.0"
edition = "2021"
publish = false
description = "RequestMaster: the window — a thin Tauri shell over the rqm-* core."

[lib]
# `_lib` suffix keeps the lib name distinct from the bin name (cargo issue 8519 on Windows).
name = "requestmaster_lib"
crate-type = ["rlib"]

[[bin]]
name = "requestmaster"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
rqm-model = { path = "../crates/rqm-model" }
rqm-postman = { path = "../crates/rqm-postman" }
rqm-store = { path = "../crates/rqm-store" }
rqm-http = { path = "../crates/rqm-http" }
rqm-runner = { path = "../crates/rqm-runner" }
# The moment of a send for its history entry.
rqm-vars = { path = "../crates/rqm-vars" }
tauri = { workspace = true }
# System "Save as" window of the export commands.
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The cancellation token of a send.
tokio-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
# Only for the tests: changes the database behind the back of the core (a broken table, a broken stored value).
rusqlite = { workspace = true }
# Runtime of the send tests; the application itself runs on the runtime Tauri starts.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
