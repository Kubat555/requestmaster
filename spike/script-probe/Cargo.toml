[package]
name = "script-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Promise::new / Promise::state / execute_pending_job need no extra features; the job loop is driven
# by hand so that host waits can be excluded from the script time budget. `parallel` is not used.
rquickjs = { version = "=0.14.0" }
tokio = { version = "=1.54.1", features = ["rt", "time", "sync"] }

[workspace]
