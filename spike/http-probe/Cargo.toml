[package]
name = "http-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# `rustls-no-provider`: rustls without a built-in crypto provider (plain `rustls` pulls aws-lc-rs);
# `ring` is installed as the process default in `lib.rs`. Decompression features are compiled in, but
# auto-decompression is switched off on the client: it hides the on-the-wire body size.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "brotli", "deflate", "zstd", "stream", "multipart", "cookies", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Same version reqwest uses; gives access to the system proxy matcher that reqwest does not expose.
hyper-util = { version = "=0.1.21", features = ["client-proxy-system"] }
http = "=1.5.0"
# Own body decoding; versions match the ones reqwest's decompression features already pull in.
flate2 = "=1.1.11"
brotli = "=9.1.1"
zstd = "=0.14.3"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "=0.7.20" }

[dev-dependencies]
wiremock = "=0.6.5"
tokio = { version = "=1.54.1", features = ["net", "io-util"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }

[workspace]
